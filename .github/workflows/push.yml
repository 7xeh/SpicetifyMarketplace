name: Push new version to dist branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Push
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: dist
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin HEAD
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            start_point="origin/$TARGET_BRANCH"
          else
            echo "origin/$TARGET_BRANCH does not exist yet, bootstrapping an empty branch"
            start_point="$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "init $TARGET_BRANCH")"
          fi
          git worktree add -B $TARGET_BRANCH dist "$start_point"

      - name: Install Dependencies and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:prod

      - name: Push New Version
        run: |
          export SHORT_SHA=$(git rev-parse --short HEAD)
          cd dist
          git add .
          git diff-index --quiet HEAD || git commit -am "Update to output generated at $SHORT_SHA"
          git push origin $TARGET_BRANCH
